[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-shape-analysis"
version = "0.1.1"
description = "Plant shape analysis and reconstruction using implicit neural representations"
readme = "README.md"
requires-python = ">=3.9"

# Core dependencies - minimal for dataloaders
dependencies = [
    "numpy",
    "torch",
    "open3d",
]

[project.optional-dependencies]
# Full installation with all dependencies
full = [
    "plyfile",
    "pymeshlab",
    "scikit-image",
    "wandb",
    "natsort",
]
# Dependencies for the predicted-label pipeline (segmentation + tracking)
predicted-labels = [
    "scikit-learn",  # MeanShift clustering for PSegNet instance segmentation
    "scipy",         # cKDTree for KNN label propagation, linear_sum_assignment for tracking
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"