[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-shape-analysis"
version = "0.1.2"
description = "Plant shape analysis and reconstruction using implicit neural representations"
readme = "README.md"
requires-python = ">=3.9"

# Core dependencies - minimal for dataloaders
dependencies = [
    "numpy",
    "torch",
    "open3d",
]

[project.optional-dependencies]
# Full installation with all dependencies
full = [
    "plyfile",
    "pymeshlab",
    "scikit-image",
    "wandb",
    "natsort",
    "scikit-learn",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"